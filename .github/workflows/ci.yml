name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` isn't in the default set — without it, draft → ready
    # transitions don't re-trigger CI.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  # Manual re-run escape hatch — `gh workflow run CI --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

# PR pushes: cancel in-flight, only the latest commit matters. Main pushes:
# run each commit (the required check must exist per merged SHA).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.1.3"
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 — matches .nvmrc and the publish job. pnpm 11 requires Node
          # >= 22.13, so the toolchain can't run on the package's declared >=18
          # floor; engines.node documents the consumer floor instead.
          node-version: "24"

      # No committed lockfile (this is a library — see .gitignore), so a frozen
      # install would fail; resolve fresh. autoInstallPeers:false keeps astro /
      # starlight build scripts from tripping ERR_PNPM_IGNORED_BUILDS.
      - run: pnpm install --no-frozen-lockfile

      - name: Lint + format check (Biome)
        run: pnpm run check

      - name: Typecheck (tsc --noEmit)
        run: pnpm run typecheck

      # Runs the commit analyzer and notes generator with .releaserc.json against
      # synthetic commits (offline), so an incompatible semantic-release /
      # conventional-changelog pairing fails this PR, not a release on main.
      - name: Release config (analyzer + notes, offline)
        run: pnpm run check:release
